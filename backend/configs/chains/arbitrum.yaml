# Arbitrum One 链配置
# Gas 成本极低（$0.01-0.1），区块时间 0.25s，适合高频测试

name: "Arbitrum One"
chain_id: 42161
native_token: "ETH"
explorer: "https://arbiscan.io"

# RPC 配置
rpc_url: "https://arb1.arbitrum.io/rpc"
rpc_urls:
  - "https://arb1.arbitrum.io/rpc"
  - "https://arbitrum-one.publicnode.com"
  - "https://rpc.ankr.com/arbitrum"
  - "https://arbitrum.llamarpc.com"
ws_url: "wss://arb1.arbitrum.io/ws"
timeout: 30

# 链特性
block_time: 0.25  # Arbitrum 区块时间约 0.25 秒
is_l2: true
l1_chain_id: 1  # 以太坊主网
sequencer_url: "https://arb1-sequencer.arbitrum.io/rpc"


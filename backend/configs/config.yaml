# DeFi 套利机器人配置文件

# 数据库配置
database:
  host: 127.0.0.1
  port: 5432
  user: defi_user
  password: defi_pass123
  dbname: defi_arbitrage
  sslmode: disable
  timezone: Asia/Shanghai
  max_idle_conns: 5
  max_open_conns: 20
  conn_max_lifetime: 3600

# 区块链配置
blockchain:
  # 主 RPC URL（以太坊主网 - 使用公共节点）
  rpc_url: https://ethereum.publicnode.com
  
  # 多 RPC URL（池模式，启用后会使用负载均衡和故障转移）
  rpc_urls:
    - https://ethereum.publicnode.com
    - https://rpc.ankr.com/eth
    - https://cloudflare-eth.com
    - https://eth.llamarpc.com
  
  chain_id: 1
  timeout: 30  # 秒
  retry: 3
  use_pool: true  # 生产环境建议启用 RPC 池

# 合约地址（如果只是寻找套利机会而不执行交易，可以留空）
contracts:
  arbitrage_core: ""
  config_manager: ""

# Keeper 配置（用于自动执行套利）
keeper:
  private_key: ""  # 使用环境变量 KEEPER_PRIVATE_KEY
  address: "0x49278f7a39e619339b54eBe715ECc3D0dB66ac35"


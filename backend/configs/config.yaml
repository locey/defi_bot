# DeFi 套利机器人配置文件
# 配置：Arbitrum One + CEX-DEX 套利

# 数据库配置
database:
  host: 127.0.0.1
  port: 5432
  user: defi_user
  password: defi_pass123
  dbname: defi_arbitrage
  sslmode: disable
  timezone: Asia/Shanghai
  max_idle_conns: 5
  max_open_conns: 20
  conn_max_lifetime: 3600

# 区块链配置 - Arbitrum One
blockchain:
  # 主 RPC URL
  rpc_url: https://arb1.arbitrum.io/rpc
  
  # 多 RPC URL（池模式）
  rpc_urls:
    - https://arb1.arbitrum.io/rpc
    - https://arbitrum-one.publicnode.com
    - https://rpc.ankr.com/arbitrum
    - https://arbitrum.llamarpc.com
  
  # WebSocket URL（用于实时订阅）
  ws_url: wss://arb1.arbitrum.io/ws
  
  chain_id: 42161  # Arbitrum One
  timeout: 30
  retry: 3
  use_pool: true

# 合约地址（Arbitrum One）
# 注意：这些地址必须与 contract/deployments/arbitrum-addresses.json 一致
contracts:
  # 核心合约
  arbitrage_core: "0x27ea15F931328474d75BE5B0a493278ba7041C74"
  config_manager: "0x121D230710dc710f5AA29b73EFc8d403707173A3"
  
  # 套利执行合约
  vault: "0xB7e37Fb429795E10A8D25752fFC69Fbab71df677"
  spot_arbitrage: "0x7e9eC412aF1f8657b99Df8f419c5D98F11F41bd5"
  flash_loan_router: "0x4A89d8B8B0376Fc8c7e2119445c828719BeC019E"
  
  # 集成合约
  double_router_integration: "0x67d905Da6b09733f1695db12A962066Ca85A95cC"
  uniswap_v2_integration: "0xf9680677Da105F3B10538A55F6e214F9c72AA120"
  
  # 工具合约
  multicall: "0xcA11bde05977b3631167028862bE2a173976CA11"
  
  # Aave V3 LendingPool（Arbitrum）- 用于闪电贷
  aave_lending_pool: "0x794a61358D6845594F94dc1DB02A252b5b4814aD"

# Keeper 配置
# ⚠️ 私钥通过环境变量 KEEPER_PRIVATE_KEY 注入，绝不在此文件中明文存储

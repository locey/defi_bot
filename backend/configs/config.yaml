# DeFi 套利机器人配置文件

# 数据库配置
database:
  # host: ${DB_HOST:localhost}
  # port: ${DB_PORT:5432}
  # user: ${DB_USER:defi_user}
  # password: ${DB_PASSWORD:defi_pass123}
  # dbname: ${DB_NAME:defi_arbitrage}
  # sslmode: disable
  # timezone: Asia/Shanghai
  # max_idle_conns: 10
  # max_open_conns: 100
  # conn_max_lifetime: 3600  # 秒
  host: 127.0.0.1
  port: 5432
  user: defi_user
  password: defi_pass123
  dbname: defi_arbitrage
  sslmode: disable
  timezone: Asia/Shanghai
  max_idle_conns: 5
  max_open_conns: 20
  conn_max_lifetime: 3600

# 区块链配置
blockchain:
  # 主 RPC URL（Sepolia 测试网）
  rpc_url: ${RPC_URL:https://rpc.ankr.com/eth_sepolia}
  
  # 多 RPC URL（池模式，启用后会使用负载均衡和故障转移）
  rpc_urls:
    - https://rpc.ankr.com/eth_sepolia
    - https://ethereum-sepolia.publicnode.com
    - https://rpc.sepolia.org
  
  chain_id: ${CHAIN_ID:11155111}
  timeout: 30  # 秒
  retry: 3
  use_pool: false  # 生产环境建议启用 RPC 池

# 合约地址
contracts:
  arbitrage_core: ${ARBITRAGE_CORE_ADDRESS:}
  config_manager: ${CONFIG_MANAGER_ADDRESS:}

# Keeper 配置（用于自动执行套利）
keeper:
  private_key: ${KEEPER_PRIVATE_KEY:}  # Keeper 私钥（用于签名交易）
  address: ${KEEPER_ADDRESS:}          # Keeper 地址


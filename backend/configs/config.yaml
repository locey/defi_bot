# 定时任务配置
scheduler:
  collect_interval: 10   # Arbitrum 出块快，降低采集间隔
  analyze_interval: 5    # 更频繁分析
  cleanup_interval: 24
  min_profit_rate: 0.1   # 降低到 0.1%（L2 Gas 便宜）

# 套利配置
arbitrage:
  min_profit_rate: 0.1   # 0.1%（Arbitrum Gas 成本低）
  max_slippage: 0.5      # 0.5%
  max_gas_price: 1       # Arbitrum Gas 很便宜，1 Gwei

# 日志配置
log:
  level: info
  dir: logs
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: true
  console: true
  json_format: false

# 服务器配置
server:
  port: 8080
  api_port: 8080
  mode: release

# Redis 配置
redis:
  enabled: true
  host: localhost
  port: 6379
  password: ""
  db: 0
  ttl: 300

# ============ CEX 配置（中心化交易所）============
cex:
  enabled: true
  
  # 币安配置
  binance:
    enabled: true
    api_endpoint: "https://api.binance.com"
    ws_endpoint: "wss://stream.binance.com:9443"
    api_key: ""
    api_secret: ""
    rate_limit: 1200
    # CEX-DEX 套利监控的交易对
    symbols:
      # 核心交易对（高流动性）
      - "ETHUSDT"
      - "BTCUSDT"
      - "ARBUSDT"
      # 稳定币对
      - "USDCUSDT"
      - "DAIUSDT"
      # DeFi 代币
      - "GMXUSDT"
      - "LINKUSDT"
      - "UNIUSDT"
      - "AAVEUSDT"
      - "CRVUSDT"
      - "PENDLEUSDT"

# ============ CEX-DEX 套利配置 ============
cexdex:
  enabled: true
  
  # 利润阈值
  min_profit_rate: 0.002    # 0.2%（Arbitrum Gas 便宜，可以更低）
  min_profit_amount: 5      # 最小 $5 利润
  
  # 交易配置
  max_trade_amount: 10000   # 单笔最大 $10,000
  min_trade_amount: 100     # 单笔最小 $100
  
  # 滑点容忍
  max_slippage: 0.003       # 0.3%
  
  # Arbitrum 上 Gas 成本极低
  estimated_gas_cost: 0.5   # 预估 $0.5 Gas 成本
  
  # 检测间隔
  check_interval: 100       # 100ms
  
  # 机会有效期
  opportunity_ttl: 3        # 3 秒（Arbitrum 出块快）
  
  # 交易对映射（DEX Token -> CEX Symbol）
  pair_mapping:
    WETH: "ETHUSDT"
    WBTC: "BTCUSDT"
    ARB: "ARBUSDT"
    USDC: "USDCUSDT"
    USDCe: "USDCUSDT"
    DAI: "DAIUSDT"
    GMX: "GMXUSDT"
    LINK: "LINKUSDT"
    UNI: "UNIUSDT"
    AAVE: "AAVEUSDT"
    CRV: "CRVUSDT"
    PENDLE: "PENDLEUSDT"

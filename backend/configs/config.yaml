# 定时任务配置
scheduler:
  # 采集价格数据的间隔（秒）
  collect_interval: 30
  # 分析套利机会的间隔（秒）
  analyze_interval: 10
  # 清理过期数据的间隔（小时）
  cleanup_interval: 24
  # 最小利润率阈值（百分比，用于过滤低利润机会）
  min_profit_rate: 0.5  # 0.5%

# 套利配置
arbitrage:
  # 最小利润率（百分比）
  min_profit_rate: 0.5
  # 最大滑点（百分比）
  max_slippage: 1.0
  # Gas 价格上限（Gwei）
  max_gas_price: 100

# 日志配置
log:
  level: info           # 日志级别: debug, info, warn, error
  dir: logs             # 日志根目录（自动按 日期/小时 创建子目录）
  max_size: 100         # 单个文件最大大小 (MB)
  max_backups: 10       # 最大备份数量
  max_age: 30           # 最大保存天数
  compress: true        # 是否压缩旧日志
  console: true         # 是否输出到控制台
  json_format: false    # 控制台输出格式: false=美化格式, true=JSON格式
  # 日志文件按模块分开存储:
  #   logs/2026-01-16/14/main.log       - 主程序日志
  #   logs/2026-01-16/14/collector.log  - 数据采集日志
  #   logs/2026-01-16/14/strategy.log   - 策略引擎日志
  #   logs/2026-01-16/14/executor.log   - 交易执行日志
  #   logs/2026-01-16/14/api.log        - API 服务日志
  #   logs/2026-01-16/14/scheduler.log  - 调度器日志
  #   logs/2026-01-16/14/web3.log       - Web3 交互日志
  #   logs/2026-01-16/14/cex.log        - CEX 采集日志

# 服务器配置
server:
  port: 8080
  api_port: 8080  # REST API 端口
  mode: release  # debug, release

# Redis 配置（可选）
redis:
  enabled: true  # 启用 Redis 缓存
  host: localhost
  port: 6379
  password: ""
  db: 0
  ttl: 300  # 默认过期时间 5 分钟

# ============ CEX 配置（中心化交易所）============
cex:
  enabled: true  # 是否启用 CEX 数据采集
  
  # 币安配置
  binance:
    enabled: true
    api_endpoint: "https://api.binance.com"
    ws_endpoint: "wss://stream.binance.com:9443"
    api_key: ""       # API Key（可选，读取公开数据不需要）
    api_secret: "" # API Secret（可选）
    rate_limit: 1200                   # 每分钟请求限制
    symbols:  # 要采集的交易对符号列表
      - "ETHUSDT"   # ETH/USDT
      - "BTCUSDT"   # BTC/USDT
      - "ETHBTC"    # ETH/BTC
      - "USDCUSDT"  # USDC/USDT
      - "DAIUSDT"   # DAI/USDT
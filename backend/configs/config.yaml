# 定时任务配置
scheduler:
  # 采集价格数据的间隔（秒）
  collect_interval: 30
  # 分析套利机会的间隔（秒）
  analyze_interval: 10
  # 清理过期数据的间隔（小时）
  cleanup_interval: 24
  # 最小利润率阈值（百分比，用于过滤低利润机会）
  min_profit_rate: 0.5  # 0.5%

# 套利配置
arbitrage:
  # 最小利润率（百分比）
  min_profit_rate: 0.5
  # 最大滑点（百分比）
  max_slippage: 1.0
  # Gas 价格上限（Gwei）
  max_gas_price: 100

# 日志配置
log:
  level: ${LOG_LEVEL:info}
  file: ${LOG_FILE:logs/app.log}
  max_size: 100  # MB
  max_backups: 10
  max_age: 30  # 天

# 服务器配置
server:
  port: ${SERVER_PORT:8080}
  api_port: ${API_PORT:8080}  # REST API 端口
  mode: release  # debug, release

# Redis 配置（可选）
redis:
  enabled: ${REDIS_ENABLED:true}  # 启用 Redis 缓存
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  db: ${REDIS_DB:0}
  ttl: 300  # 默认过期时间 5 分钟

# ============ CEX 配置（中心化交易所）============
cex:
  enabled: ${CEX_ENABLED:true}  # 是否启用 CEX 数据采集
  
  # 币安配置
  binance:
    enabled: ${BINANCE_ENABLED:true}
    api_endpoint: "https://api.binance.com"
    ws_endpoint: "wss://stream.binance.com:9443"
    api_key: ${BINANCE_API_KEY:}       # API Key（可选，读取公开数据不需要）
    api_secret: ${BINANCE_API_SECRET:} # API Secret（可选）
    rate_limit: 1200                   # 每分钟请求限制
    symbols:  # 要采集的交易对符号列表
      - "ETHUSDT"   # ETH/USDT
      - "BTCUSDT"   # BTC/USDT
      - "ETHBTC"    # ETH/BTC
      - "USDCUSDT"  # USDC/USDT
      - "DAIUSDT"   # DAI/USDT


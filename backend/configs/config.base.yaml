# 代币配置 - Base
tokens:
  - symbol: "WETH"
    address: "0x4200000000000000000000000000000000000006"
    decimals: 18
    cex_symbol: "ETHUSDT"
  - symbol: "USDC"
    address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
    decimals: 6
    cex_symbol: "USDCUSDT"
  - symbol: "USDbC"
    address: "0xd9aAEc86B65D86f6A7B5B1b0c42FFA531710b6CA"
    decimals: 6
    cex_symbol: "USDCUSDT"
  - symbol: "DAI"
    address: "0x50c5725949A6F0c72E6C4a641F24049A917DB0Cb"
    decimals: 18
    cex_symbol: "DAIUSDT"
  - symbol: "cbETH"
    address: "0x2Ae3F1Ec7F1F5012CFEab0185bfc7aa3cf0DEc22"
    decimals: 18
  - symbol: "AERO"
    address: "0x940181a94A35A4569E4529A3CDfB74e38FD98631"
    decimals: 18

# 定时任务配置
scheduler:
  collect_interval: 10
  analyze_interval: 5
  cleanup_interval: 24
  min_profit_rate: 0.4
  mode: high_performance
  enable_execution: true
  dry_run: true
  min_confidence: 0.15
  max_concurrent_exec: 3

# 套利配置
arbitrage:
  min_profit_rate: 0.4
  max_slippage: 0.5
  max_gas_price: 1

# 日志配置
log:
  level: info
  dir: logs
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: true
  console: true
  json_format: false

# 服务器配置
server:
  port: 8081
  api_port: 8081
  mode: release

# Redis 配置
redis:
  enabled: true
  host: localhost
  port: 6379
  password: ""
  db: 1
  ttl: 300

# CEX 配置
cex:
  enabled: true
  binance:
    enabled: true
    api_endpoint: "https://api.binance.us"
    ws_endpoint: "wss://stream.binance.us:9443/ws"
    api_key: ""
    api_secret: ""
    rate_limit: 1200
    symbols:
      - "ETHUSDT"
      - "USDCUSDT"

# CEX-DEX 套利配置
cexdex:
  enabled: true
  min_profit_rate: 0.0012
  min_profit_amount: 1
  max_trade_amount: 10000
  min_trade_amount: 100
  max_slippage: 0.003
  estimated_gas_cost: 0.3
  check_interval: 100
  opportunity_ttl: 3
  pair_mapping:
    WETH: "ETHUSDT"
    USDC: "USDCUSDT"
    USDbC: "USDCUSDT"
    DAI: "DAIUSDT"

# Prometheus 指标
metrics:
  enabled: false
  port: 9091

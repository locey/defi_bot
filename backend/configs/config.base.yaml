# DeFi 套利机器人配置文件
# 配置：Base (chainId 8453) + CEX-DEX 套利

# 数据库配置（与 Arbitrum 共用同一 DB 实例）
database:
  host: 127.0.0.1
  port: 5432
  user: defi_user
  password: defi_pass123
  dbname: defi_arbitrage_base
  sslmode: disable
  timezone: Asia/Shanghai
  max_idle_conns: 5
  max_open_conns: 20
  conn_max_lifetime: 3600

# 区块链配置 - Base
blockchain:
  rpc_url: https://base-mainnet.public.blastapi.io
  rpc_urls:
    - https://1rpc.io/base
    - https://base.drpc.org
    - https://base-mainnet.public.blastapi.io
    - https://base.publicnode.com
    - https://mainnet.base.org
  ws_url: wss://base.publicnode.com
  chain_id: 8453
  timeout: 30
  retry: 3
  use_pool: true

# 合约地址 — 需部署后填入
contracts:
  arbitrage_core: ""
  config_manager: ""
  vault: ""
  spot_arbitrage: ""
  double_router_integration: ""
  uniswap_v2_integration: ""
  multicall: "0xcA11bde05977b3631167028862bE2a173976CA11"
  aave_lending_pool: "0xA238Dd80C259a72e81d7e4664a9801593F98d1c5"
  flash_loan_arbitrage: ""
  flash_loan_router: ""

# Keeper 配置
keeper:
  private_key: ""
  address: "0x49278f7a39e619339b54eBe715ECc3D0dB66ac35"


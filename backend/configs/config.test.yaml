# 测试配置文件（使用公共 RPC 和测试网）

# 数据库配置 - 连接到 WSL2 的 PostgreSQL 
# ( 获取 Windows 主机的 IP（从 WSL 角度 看 docker desktop）
# ip route | grep default | awk '{print go run scripts/utils/add_missing_data.go$3}'
database:
  host: 127.0.0.1
  port: 5432
  user: defi_user
  password: defi_pass123
  dbname: defi_arbitrage
  sslmode: disable
  timezone: Asia/Shanghai
  max_idle_conns: 5
  max_open_conns: 20
  conn_max_lifetime: 3600

# 区块链配置（Sepolia 测试网）
blockchain:
  # 选项1：使用 Infura 公共端点（需要替换 YOUR_INFURA_KEY）
  # rpc_url: https://sepolia.infura.io/v3/3bbd17e943844442bd02357af9292ebe
  
  # 选项2：使用 Cloudflare 公共端点（无需 API Key，但有速率限制）
  # rpc_url: https://cloudflare-eth.com
  
  # 选项3：使用公共 Sepolia RPC
  rpc_url: https://ethereum-sepolia-rpc.publicnode.com
  
  chain_id: 11155111  # Sepolia 测试网
  timeout: 60  # 公共 RPC 可能较慢，增加超时时间
  retry: 3

# 合约地址
contracts:
  arbitrage_core: "0x16D275cABF4e8980B01FFC416E7b7Cc39c44F9CF"  # 已部署到 Sepolia
  config_manager: "0x55C07CCd00932Bd3813F90E01dA08b70A58583eb"  # 已部署到 Sepolia

# Keeper 配置（执行套利交易的账户）
keeper:
  address: ""  # 填写你的 Sepolia 测试地址
  private_key: ""  # 填写你的私钥（不要提交到 git！）

# DEX 配置（Sepolia 测试网）
dexes:
  # ============ AMM - V2 类型 ============
  
  # Uniswap V2 (Sepolia)
  - name: "Uniswap V2"
    dex_type: "amm"
    protocol: "uniswap_v2"
    router: "0xC532a74256D3Db42D0Bf7a0400fEFDbad7694008"  # Sepolia 路由
    factory: "0x7E0987E5b3a30e3f2828572Bb659A548460a3003"  # Sepolia 工厂
    quoter: ""  # V2 不需要 Quoter
    fee: 30
    fee_tier: 0
    version: "v2"
    chain_id: 11155111
    support_flash_loan: false
    support_multi_hop: true
    priority: 100
  
  # SushiSwap (Sepolia) - 如果测试网有部署
  # - name: "SushiSwap"

# 测试配置文件（使用公共 RPC 和测试网）

# 数据库配置（测试网环境）
# 主网数据库: defi_arbitrage
# 测试网数据库: defi_arbitrage_test
database:
  host: 127.0.0.1
  port: 5432
  user: defi_user
  password: defi_pass123
  dbname: defi_arbitrage_test  # 测试环境使用独立数据库
  sslmode: disable
  timezone: Asia/Shanghai
  max_idle_conns: 10      # 优化：增加连接池
  max_open_conns: 50      # 优化：增加最大连接数
  conn_max_lifetime: 3600

# 区块链配置（Sepolia 测试网）
blockchain:
  # 主 RPC URL
  rpc_url: https://ethereum-sepolia-rpc.publicnode.com
  
  # WebSocket URL（可选）
  ws_url: ""  # 公共 RPC 不支持 WebSocket
  
  # 多 RPC URL 池（负载均衡和故障转移）
  rpc_urls:
    - https://ethereum-sepolia-rpc.publicnode.com
    - https://rpc.sepolia.org
    - https://eth-sepolia-public.unifra.io
  
  # Alchemy Sepolia（如果有 API Key）
  # rpc_url: https://eth-sepolia.g.alchemy.com/v2/YOUR_API_KEY
  # ws_url: wss://eth-sepolia.g.alchemy.com/v2/YOUR_API_KEY
  
  chain_id: 11155111  # Sepolia 测试网
  timeout: 60
  retry: 3
  use_pool: true  # 启用 RPC 池提高稳定性
  verify_token_decimals: true

# 合约地址
contracts:
  arbitrage_core: "0x16D275cABF4e8980B01FFC416E7b7Cc39c44F9CF"  # 已部署到 Sepolia
  config_manager: "0x55C07CCd00932Bd3813F90E01dA08b70A58583eb"  # 已部署到 Sepolia


# 定时任务配置
scheduler:
  collect_interval: 30   # 30 秒采集一次
  analyze_interval: 60   # 60 秒分析一次
  cleanup_interval: 24   # 24 小时清理一次
  min_profit_rate: 0.5   # 最小利润率阈值 0.5%

# 套利配置
arbitrage:
  min_profit_rate: 0.5
  max_slippage: 1.0
  max_gas_price: 100

# ===================== 高性能采集器配置 =====================
# 注意：分层监控基于"已发现的交易对"，根据TVL和交易量决定监控频率
# 工作流程：tokens配置 → 发现交易对 → 获取TVL → 分层监控
high_performance:
  enabled: false  # 测试网暂不启用高性能模式（需要 WebSocket）
  
  # 分层监控配置（测试网TVL阈值降低以适应测试环境）
  tiers:
    # Tier 1 - 核心池
    tier1:
      min_tvl: 100000          # $100K TVL（测试网降低阈值）
      min_volume_24h: 50000    # $50K 24h交易量
      method: "multicall"      # 测试网用 Multicall 代替 WebSocket
    
    # Tier 2 - 活跃池
    tier2:
      min_tvl: 10000           # $10K TVL
      min_volume_24h: 5000     # $5K 24h交易量
      method: "multicall"
      interval: "5s"           # 测试网减慢轮询
    
    # Tier 3 - 潜力池
    tier3:
      min_tvl: 1000            # $1K TVL
      min_volume_24h: 500      # $500 24h交易量
      method: "multicall"
      interval: "10m"
  
  # Multicall配置（批量调用优化）
  multicall:
    address: "0xcA11bde05977b3631167028862bE2a173976CA11"  # Multicall3
    batch_size: 100    # 测试网减少批次大小（避免限流）
    timeout: "10s"
  
  # 价格缓存配置
  price_cache:
    change_threshold: 0.0001  # 价格变化0.01%才触发更新
    subscriber_buffer: 1000

# ===================== 策略引擎配置 =====================
strategy:
  precompute_paths: true   # 启动时预计算路径
  min_path_length: 3       # 最小路径长度
  max_path_length: 4       # 最大路径长度
  max_concurrent_paths: 50 # 测试网减少并发数
  
  # 利润阈值
  profit_thresholds:
    length_3: 0.003  # 3跳：0.3%
    length_4: 0.005  # 4跳：0.5%
  
  # 风险配置
  risk:
    max_slippage: 0.01
    min_confidence: 0.7
    gas_multiplier: 2.0
  
  execution_strategy: "balanced"  # profit_first, low_risk, balanced

# ===================== 执行器配置 =====================
executor:
  enabled: false      # 测试网默认不自动执行
  dry_run: true       # 干运行模式
  max_concurrent: 1   # 测试网限制并发
  timeout: "30s"
  
  # 安全限制
  max_amount_per_trade: "0.1"    # 测试网单笔最大 0.1 ETH
  daily_loss_limit: "0.5"        # 每日最大亏损 0.5 ETH
  min_profit_usd: 1              # 最小 $1 利润

# ===================== 监控配置 =====================
monitoring:
  stats_interval: "30s"  # 统计打印间隔
  
  prometheus:
    enabled: false  # 测试网暂不启用
    port: 9090

# 日志配置
log:
  level: debug          # 测试环境使用 debug 级别
  dir: logs             # 日志根目录
  max_size: 50          # 单个文件最大大小 (MB)
  max_backups: 3        # 最大备份数量
  max_age: 7            # 最大保存天数
  compress: false       # 测试环境不压缩
  console: true         # 输出到控制台
  json_format: false    # 使用美化格式便于调试

# 服务器配置
server:
  port: 8080
  api_port: 8080
  mode: debug

# Redis 配置
redis:
  enabled: true
  host: localhost
  port: 6379
  password: ""
  db: 1  # 测试网使用独立的 Redis DB
  ttl: 300

# CEX 配置
cex:
  enabled: false  # 测试网暂不启用 CEX
  binance:
    enabled: false


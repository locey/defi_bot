# 定时任务配置（测试时使用较长的间隔）
scheduler:
  collect_interval: 300  # 5 分钟采集一次（避免频繁调用公共 RPC）
  analyze_interval: 600  # 10 分钟分析一次
  cleanup_interval: 24   # 24 小时清理一次

# 套利配置
arbitrage:
  min_profit_rate: 0.5
  max_slippage: 1.0
  max_gas_price: 100

# 日志配置
log:
  level: info
  file: logs/test.log
  max_size: 100
  max_backups: 3
  max_age: 7

# 服务器配置
server:
  port: 8080
  mode: debug

# Redis 配置
redis:
  enabled: true  # 启用 Redis 缓存
  host: localhost
  port: 6379
  password: ""
  db: 0
  ttl: 300  # 默认过期时间 5 分钟

